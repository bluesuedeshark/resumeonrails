# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# 12 days, decaying then plateauing, so CarlineController#load_metrics has something
# real to compute against:
#   avg_wait  = mean(all 12)                      = 14.1
#   baseline  = mean(last 10)                      = 12.2
#   threshold = baseline * 1.15                     = 14.03
#   plateau_start = first day <= threshold          = day05 (14 <= 14.03)
#   worst_day = day01 (worst_wait_minutes 40, the max)
# See test/controllers/carline_controller_test.rb, which asserts these exact values.

day01:
  observed_on: 2026-01-01
  dismissal_time: 3:00 PM
  avg_wait_minutes: 25
  worst_wait_minutes: 40
  cars_in_line: 25
  note: First week chaos, the line backs onto the highway.

