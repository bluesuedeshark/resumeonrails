app = "resumeonrails"
primary_region = "iad"

[build]

[env]
  RAILS_LOG_TO_STDOUT = "1"
  RAILS_SERVE_STATIC_FILES = "true"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "resumeonrails_data"
  destination = "/rails/storage"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
